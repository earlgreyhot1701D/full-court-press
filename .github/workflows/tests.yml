# Runs the offline test suite on every push and pull request.
# No AWS, no API key, no model calls: tests use recorded fixtures only.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt ruff==0.16.9
      - name: Lint (ruff, correctness rules in ruff.toml)
        run: ruff check .
      - run: python -m pytest -q
        env:
          PYTHONPATH: src:tests
