<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Slab;src:url(AlfaSlabOne-Regular.ttf)}
@font-face{font-family:Arch;src:url(Archivo-VariableFont_wdth_wght.ttf);font-weight:100 900}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:400px;background:#FCF3F5;background-image:radial-gradient(circle,rgba(255,72,176,.14) 26%,transparent 28%);background-size:22px 22px;position:relative;overflow:hidden;font-family:Arch}
.mast{position:absolute;left:60px;top:74px;display:flex;flex-direction:row;gap:22px;align-items:center}
.w{display:inline-block;font-family:Slab;font-size:70px;line-height:1;padding:6px 20px 10px;border:5px solid #2B1A2F;box-shadow:9px 9px 0 #2B1A2F;text-transform:uppercase;width:max-content}
.w1{background:#FF48B0;color:#2B1A2F;transform:rotate(-3deg)}
.w2{background:#2B1A2F;color:#FCF3F5;font-family:Arch;font-weight:900;transform:rotate(2deg);box-shadow:9px 9px 0 #FF48B0}
.w3{background:#F4E27A;color:#2B1A2F;transform:rotate(-1.5deg);}
.icon{position:absolute;right:60px;top:40px;width:210px;height:210px;transform:rotate(4deg)}
.stamp{position:absolute;left:70px;top:205px;border:5px solid #B8156E;color:#B8156E;font-family:Slab;font-size:38px;padding:4px 18px;transform:rotate(-8deg);letter-spacing:2px;opacity:.9}
.band{position:absolute;left:0;right:0;bottom:0;height:84px;background:#2B1A2F;color:#FCF3F5;display:flex;align-items:center;justify-content:space-between;padding:0 70px;font-size:30px;font-weight:700}
.band b{color:#FF48B0;font-family:Slab;font-weight:400;font-size:32px}
</style></head><body>
<div class="mast"><span class="w w1">Full</span><span class="w w2">Court</span><span class="w w3">Press</span></div>
<img class="icon" src="favicon.svg">
<div class="stamp">FINAL</div>
<div class="band"><span>The zine for every WNBA game</span><b>fullcourtpress.lol</b></div>
</body></html>
