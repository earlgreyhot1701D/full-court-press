<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Slab;src:url(AlfaSlabOne-Regular.ttf)}
@font-face{font-family:Arch;src:url(Archivo-VariableFont_wdth_wght.ttf);font-weight:100 900}
@font-face{font-family:Hand;src:url(Caveat-VariableFont_wght.ttf);font-weight:400 700}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:675px;background:#FCF3F5;background-image:radial-gradient(circle,rgba(255,72,176,.14) 26%,transparent 28%);background-size:22px 22px;position:relative;overflow:hidden;font-family:Arch}
.mast{position:absolute;left:70px;top:70px;display:flex;flex-direction:column;gap:20px}
.w{display:inline-block;font-family:Slab;font-size:100px;line-height:1;padding:6px 20px 10px;border:5px solid #2B1A2F;box-shadow:9px 9px 0 #2B1A2F;text-transform:uppercase;width:max-content}
.w1{background:#FF48B0;color:#2B1A2F;transform:rotate(-3deg)}
.w2{background:#2B1A2F;color:#FCF3F5;font-family:Arch;font-weight:900;transform:rotate(2deg);margin-left:64px;box-shadow:9px 9px 0 #FF48B0}
.w3{background:#F4E27A;color:#2B1A2F;transform:rotate(-1.5deg);margin-left:14px}
.icon{position:absolute;right:80px;top:80px;width:250px;height:250px;transform:rotate(4deg)}
.note{position:absolute;right:110px;top:40px;font-family:Hand;font-weight:700;font-size:40px;color:#B8156E;transform:rotate(-6deg)}
.stamp{position:absolute;right:110px;top:380px;border:5px solid #B8156E;color:#B8156E;font-family:Slab;font-size:36px;padding:2px 14px;transform:rotate(-8deg);letter-spacing:2px}
.band{position:absolute;left:0;right:0;bottom:0;height:120px;background:#2B1A2F;color:#FCF3F5;display:flex;align-items:center;justify-content:space-between;padding:0 70px}
.band .t{font-family:Slab;font-size:32px;letter-spacing:.3px}
.band .t b{color:#FF48B0;font-weight:400}
.band .u{font-weight:800;font-size:17px;color:#FCF3F5;opacity:.85;letter-spacing:.06em}
.dom{position:absolute;right:110px;top:470px;font-weight:800;font-size:20px;color:#2B1A2F;letter-spacing:.06em}</style></head><body>
<div class="mast"><span class="w w1">Full</span><span class="w w2">Court</span><span class="w w3">Press</span></div>
<div class="note">a zine for every WNBA game &rarr;</div>
<img class="icon" src="favicon.svg">
<div class="stamp">FINAL</div><div class="dom">fullcourtpress.lol</div>
<div class="band"><span class="t">Can AI write a sports recap without making up stats? <b>Mostly.</b></span></div>
</body></html>
